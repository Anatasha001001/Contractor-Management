<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Power Automate Test</title>
</head>

<body>

    <h2>Power Automate Submission Test</h2>

    <button onclick="testSubmit()">Test Submit</button>

    <script>

        // PASTE YOUR POWER AUTOMATE HTTP POST URL HERE
        const flowUrl = "PASTE_YOUR_POWER_AUTOMATE_HTTP_URL_HERE";


        async function testSubmit() {

            const testData = {
                WorkOrderId: 1,
                PO_ID: "4000000943_10",
                WorkOrder: 983068020,
                Description: "[MOC] B210-020726",
                TypeofJob: "N",
                ReplacementID: null,
                ReplacementSharePointID: null,

                Workers: [
                    {
                        SharePointID: 1,
                        EmpID: "TEST001",
                        FirstName: "Test",
                        LastName: "Worker 1",
                        Designation: "Contractor",
                        Company: "Test Company"
                    },
                    {
                        SharePointID: 2,
                        EmpID: "TEST002",
                        FirstName: "Test",
                        LastName: "Worker 2",
                        Designation: "Contractor",
                        Company: "Test Company"
                    }
                ]
            };


            try {

                const response = await fetch(flowUrl, {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(testData)
                });


                const result = await response.json();

                console.log("Power Automate response:", result);

                if (response.ok) {

                    alert("SUCCESS! Data sent to Power Automate.");

                } else {

                    alert("FAILED! HTTP Status: " + response.status);

                }

            } catch (error) {

                console.error(error);

                alert("ERROR: " + error.message);

            }
        }

    </script>

</body>
</html>
