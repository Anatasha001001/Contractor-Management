<!DOCTYPE html>
<html>
<head>
    <title>HTTP Trigger Test</title>
</head>

<body>

    <button onclick="testFlow()">
        Test Power Automate
    </button>

    <script>

        async function testFlow() {

            const flowUrl = "https://0eb71ffa4b02edec861c63608d58f3.42.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/0567c146a09f4c0eb2e170c73e539d0d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hTOEvG9YzWgY1U63SGf7xruK7jXD9JO1ZnjmfBcDt34";

            try {

                const response = await fetch(flowUrl, {
                    method: "POST"
                });

                const result = await response.text();

                console.log("Status:", response.status);
                console.log("Response:", result);

                alert(
                    "HTTP Status: " +
                    response.status +
                    "\n\n" +
                    result
                );

            } catch (error) {

                console.error(error);

                alert(
                    "ERROR:\n" +
                    error
                );
            }
        }

    </script>

</body>
</html>
