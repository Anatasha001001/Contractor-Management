<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contractor Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef3f8;
            color: #172b4d;
        }

        .page-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .header {
            background: #063b66;
            color: white;
            padding: 25px 30px;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .card {
            background: white;
            padding: 25px 30px;
            margin-bottom: 20px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #063b66;
            margin-bottom: 15px;
            border-bottom: 2px solid #e3eaf1;
            padding-bottom: 8px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        select,
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #1677c8;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .po-details {
            background: #f5f8fb;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            padding: 18px;
            margin-top: 15px;
        }

        .po-detail-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            margin-bottom: 8px;
        }

        .po-detail-label {
            font-weight: 600;
            color: #5d6d7e;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            padding-right: 40px;
        }

        .dropdown-list {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            background: white;
            border: 1px solid #ccd6e0;
            border-top: none;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12);
        }

        .dropdown-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #edf1f4;
        }

        .dropdown-item:hover {
            background: #f1f6fa;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .hidden {
            display: none !important;
        }

        .job-type-container {
            display: flex;
            gap: 12px;
        }

        .job-option {
            flex: 1;
        }

        .job-option input {
            display: none;
        }

        .job-option label {
            padding: 12px;
            text-align: center;
            border: 1px solid #ccd6e0;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0;
        }

        .job-option input:checked + label {
            background: #063b66;
            color: white;
            border-color: #063b66;
        }

        .worker-search {
            position: relative;
        }

        .selected-workers {
            margin-top: 20px;
        }

        .worker-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #f6f9fc;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .worker-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .worker-name {
            font-weight: 600;
            color: #063b66;
        }

        .worker-details {
            font-size: 13px;
            color: #667788;
        }

        .remove-worker {
            border: none;
            background: #fbe8e8;
            color: #b42318;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .remove-worker:hover {
            background: #f6d3d3;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            font-family: inherit;
        }

        .btn {
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-add {
            background: #e8f2fa;
            color: #063b66;
        }

        .btn-add:hover {
            background: #d8e9f6;
        }

        .btn-submit {
            background: #063b66;
            color: white;
            min-width: 130px;
        }

        .btn-submit:hover {
            background: #042c4d;
        }

        .btn-submit:disabled {
            background: #a8b5c1;
            cursor: not-allowed;
        }

        .replacement-container {
            margin-top: 15px;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 7px;
            font-size: 14px;
        }

        .success-message {
            background: #e8f7ee;
            border: 1px solid #b7e4c7;
            color: #176b3a;
        }

        .error-message {
            background: #fdecec;
            border: 1px solid #f5c2c2;
            color: #a61b1b;
        }

        .info-message {
            background: #eaf4fb;
            border: 1px solid #c7e0f2;
            color: #145b85;
        }

        @media (max-width: 700px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .job-type-container {
                flex-direction: column;
            }

            .po-detail-row {
                grid-template-columns: 1fr;
                gap: 3px;
            }

            .page-container {
                margin: 10px auto;
                padding: 0 10px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<div class="page-container">

    <div class="header">
        <h1>Contractor Management</h1>
        <p>Worker Assignment</p>
    </div>

    <div class="card">

        <!-- PO SECTION -->
        <div class="section">

            <div class="section-title">
                Purchase Order
            </div>

            <div class="form-group">

                <label for="poSearch">
                    Search / Select PO
                </label>

                <div class="search-container">

                    <input
                        type="text"
                        id="poSearch"
                        class="search-input"
                        placeholder="Search PO..."
                        autocomplete="off"
                    >

                    <div
                        id="poDropdown"
                        class="dropdown-list hidden">
                    </div>

                </div>

            </div>

            <div
                id="poDetails"
                class="po-details hidden">

                <div class="po-detail-row">
                    <div class="po-detail-label">
                        PO ID
                    </div>
                    <div id="displayPOID"></div>
                </div>

                <div class="po-detail-row">
                    <div class="po-detail-label">
                        Work Order
                    </div>
                    <div id="displayWorkOrder"></div>
                </div>

                <div class="po-detail-row">
                    <div class="po-detail-label">
                        Description
                    </div>
                    <div id="displayDescription"></div>
                </div>

            </div>

        </div>


        <!-- JOB TYPE -->
        <div class="section">

            <div class="section-title">
                Job Type
            </div>

            <div class="job-type-container">

                <div class="job-option">
                    <input
                        type="radio"
                        id="jobNew"
                        name="jobType"
                        value="N"
                    >
                    <label for="jobNew">
                        New
                    </label>
                </div>

                <div class="job-option">
                    <input
                        type="radio"
                        id="jobReplacement"
                        name="jobType"
                        value="R"
                    >
                    <label for="jobReplacement">
                        Replacement
                    </label>
                </div>

                <div class="job-option">
                    <input
                        type="radio"
                        id="jobAdditional"
                        name="jobType"
                        value="A"
                    >
                    <label for="jobAdditional">
                        Additional
                    </label>
                </div>

            </div>

        </div>


        <!-- REPLACEMENT / ADDITIONAL -->
<div
    id="replacementSection"
    class="section hidden">

    <div class="section-title" id="replacementSectionTitle">
        Replacement ID
    </div>

    <div class="replacement-container">

        <label for="replacementSelect">
            Select Replacement
        </label>

        <select id="replacementSelect">

            <option value="">
                Select Replacement ID
            </option>

        </select>

    </div>


    <!-- SELECTED PERSON DETAILS -->
    <div
        id="replacementPersonDetails"
        class="section hidden"
        style="margin-top: 20px;">

        <div class="section-title">
            Selected Worker Details
        </div>

        <div class="form-row">

            <div class="form-group">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    id="replacementFirstName"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    id="replacementLastName"
                    readonly
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    Designation
                </label>

                <input
                    type="text"
                    id="replacementDesignation"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Company
                </label>

                <input
                    type="text"
                    id="replacementCompany"
                    readonly
                >

            </div>

        </div>

    </div>

</div>


        <!-- WORKER -->
        <div class="section">

            <div class="section-title">
                Worker Assignment
            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="workerSearch">
                        Search Worker
                    </label>

                    <div class="search-container worker-search">

                        <input
                            type="text"
                            id="workerSearch"
                            placeholder="Search worker..."
                            autocomplete="off"
                        >

                        <div
                            id="workerDropdown"
                            class="dropdown-list hidden">
                        </div>

                    </div>

                </div>

                <div class="form-group">

                    <label for="workerDesignation">
                        Designation
                    </label>

                    <input
                        type="text"
                        id="workerDesignation"
                        readonly
                        placeholder="Worker designation"
                    >

                </div>

            </div>

            <button
                type="button"
                id="addWorkerBtn"
                class="btn btn-add">
                + Add Worker
            </button>


            <div
                id="selectedWorkers"
                class="selected-workers">
            </div>

        </div>


        <!-- SUBMIT -->
        <div class="btn-container">

            <button
                type="button"
                id="submitBtn"
                class="btn btn-submit">
                Submit All
            </button>

        </div>


        <!-- STATUS -->
        <div
            id="statusMessage"
            class="status-message hidden">
        </div>

    </div>

</div>

/*
==========================================================
PO SEARCH
==========================================================
*/

function renderPODropdown(searchText = "") {

    const text =
        searchText
            .toLowerCase()
            .trim();

    const filtered =
        poData.filter(function (po) {

            return (
                String(po.PO_ID || "")
                    .toLowerCase()
                    .includes(text)
                ||
                String(po.WorkOrder || "")
                    .toLowerCase()
                    .includes(text)
                ||
                String(po.Description || "")
                    .toLowerCase()
                    .includes(text)
            );

        });

    poDropdown.innerHTML = "";

    filtered.slice(0, 50).forEach(function (po) {

        const item =
            document.createElement("div");

        item.className =
            "dropdown-item";

        item.textContent =
            (po.PO_ID || "") +
            " - " +
            (po.WorkOrder || "");

        item.addEventListener(
            "click",
            function () {
                selectPO(po);
            }
        );

        poDropdown.appendChild(item);

    });

    if (filtered.length > 0) {

        poDropdown.classList.remove("hidden");

    } else {

        poDropdown.classList.add("hidden");

    }

}


function selectPO(po) {

    selectedPO = po;

    poSearch.value =
        po.PO_ID || "";

    displayPOID.textContent =
        po.PO_ID || "-";

    displayWorkOrder.textContent =
        po.WorkOrder || "-";

    displayDescription.textContent =
        po.Description || "-";

    poDetails.classList.remove("hidden");

    poDropdown.classList.add("hidden");

}


/*
==========================================================
PO EVENTS
==========================================================
*/

poSearch.addEventListener(
    "focus",
    function () {
        renderPODropdown(poSearch.value);
    }
);

poSearch.addEventListener(
    "input",
    function () {
        renderPODropdown(poSearch.value);
    }
);


/*
==========================================================
JOB TYPE
==========================================================
*/

document
    .querySelectorAll('input[name="jobType"]')
    .forEach(function (radio) {

        radio.addEventListener(
            "change",
            function () {

                if (this.value === "R" || this.value === "A") {

                    replacementSection
                        .classList
                        .remove("hidden");

                    const title =
                        document.getElementById(
                            "replacementSectionTitle"
                        );

                    const label =
                        document.querySelector(
                            'label[for="replacementSelect"]'
                        );

                    if (this.value === "R") {

                        title.textContent = "Replacement ID";
                        label.textContent = "Select Replacement";

                    } else {

                        title.textContent = "Additional ID";
                        label.textContent = "Select Additional";

                    }

                    loadReplacementData(this.value);

                } else {

                    replacementSection
                        .classList
                        .add("hidden");

                    selectedReplacement = null;

                    replacementSelect.value = "";

                    document
                        .getElementById("replacementPersonDetails")
                        .classList
                        .add("hidden");

                }

            }
        );

    });


/*
==========================================================
REPLACEMENT
==========================================================
*/

function loadReplacementData(jobType) {

    replacementSelect.innerHTML =
        '<option value="">Select ID</option>';

    const filteredData =
        replacementAdditionalData.filter(
            function (item) {
                return String(item.TypeofJob) === String(jobType);
            }
        );

    filteredData.forEach(
        function (item) {

            const option =
                document.createElement("option");

            option.value =
                item.Id;

            option.textContent =
                item.ReplacementID;

            replacementSelect
                .appendChild(option);

        }
    );

}


replacementSelect.addEventListener(
    "change",
    function () {

        const id = this.value;

        selectedReplacement =
            replacementAdditionalData.find(
                function (item) {
                    return String(item.Id) === String(id);
                }
            ) || null;

        if (selectedReplacement) {

            document.getElementById("replacementFirstName").value =
                selectedReplacement.FirstName || "";

            document.getElementById("replacementLastName").value =
                selectedReplacement.LastName || "";

            document.getElementById("replacementDesignation").value =
                selectedReplacement.Designation || "";

            document.getElementById("replacementCompany").value =
                selectedReplacement.Company || "";

            document
                .getElementById("replacementPersonDetails")
                .classList
                .remove("hidden");

        } else {

            document.getElementById("replacementFirstName").value = "";
            document.getElementById("replacementLastName").value = "";
            document.getElementById("replacementDesignation").value = "";
            document.getElementById("replacementCompany").value = "";

            document
                .getElementById("replacementPersonDetails")
                .classList
                .add("hidden");

        }

    }
);


/*
==========================================================
WORKER SEARCH
==========================================================
*/

function renderWorkerDropdown(searchText = "") {

    const text =
        searchText
            .toLowerCase()
            .trim();

    const filtered =
        workerData.filter(function (worker) {

            const fullName =
                (
                    String(worker.FirstName || "") +
                    " " +
                    String(worker.LastName || "")
                ).toLowerCase();

            return (
                fullName.includes(text)
                ||
                String(worker.EmpID || "")
                    .toLowerCase()
                    .includes(text)
                ||
                String(worker.Company || "")
                    .toLowerCase()
                    .includes(text)
            );

        });

    workerDropdown.innerHTML = "";

    filtered
        .filter(function (worker) {

            return !selectedWorkers.some(
                function (selected) {

                    return (
                        selected.Id === worker.Id
                    );

                }
            );

        })
        .slice(0, 50)
        .forEach(function (worker) {

            const item =
                document.createElement("div");

            item.className =
                "dropdown-item";

            item.innerHTML =
                "<strong>" +
                (worker.FirstName || "") +
                " " +
                (worker.LastName || "") +
                "</strong><br>" +
                "<small>" +
                (worker.EmpID || "") +
                " | " +
                (worker.Company || "") +
                "</small>";

            item.addEventListener(
                "click",
                function () {

                    selectWorker(worker);

                }
            );

            workerDropdown
                .appendChild(item);

        });

    if (workerDropdown.children.length > 0) {

        workerDropdown
            .classList
            .remove("hidden");

    } else {

        workerDropdown
            .classList
            .add("hidden");

    }

}


function selectWorker(worker) {

    workerSearch.value =
        (
            worker.FirstName || ""
        ) +
        " " +
        (
            worker.LastName || ""
        );

    workerDesignation.value =
        worker.Designation || "";

    workerSearch.dataset.workerId =
        worker.Id;

    workerSearch.dataset.workerJson =
        JSON.stringify(worker);

    workerDropdown
        .classList
        .add("hidden");

}


/*
==========================================================
WORKER EVENTS
==========================================================
*/

workerSearch.addEventListener(
    "focus",
    function () {

        renderWorkerDropdown(
            workerSearch.value
        );

    }
);


workerSearch.addEventListener(
    "input",
    function () {

        workerDesignation.value = "";

        delete workerSearch.dataset.workerId;
        delete workerSearch.dataset.workerJson;

        renderWorkerDropdown(
            workerSearch.value
        );

    }
);

            selectedWorkers.some(
                function (item) {
                    return item.Id === worker.Id;
                }
            );

        if (alreadyAdded) {

            showStatus(
                "This worker has already been added.",
                "error"
            );

            return;

        }

        selectedWorkers.push(worker);

        renderSelectedWorkers();

        workerSearch.value = "";
        workerDesignation.value = "";

        delete workerSearch.dataset.workerId;
        delete workerSearch.dataset.workerJson;

    }
);


/*
==========================================================
RENDER SELECTED WORKERS
==========================================================
*/

function renderSelectedWorkers() {

    selectedWorkersContainer.innerHTML = "";

    selectedWorkers.forEach(
        function (worker, index) {

            const card =
                document.createElement("div");

            card.className =
                "worker-card";

            const info =
                document.createElement("div");

            info.className =
                "worker-info";

            const name =
                document.createElement("div");

            name.className =
                "worker-name";

            name.textContent =
                (
                    worker.FirstName || ""
                ) +
                " " +
                (
                    worker.LastName || ""
                );

            const details =
                document.createElement("div");

            details.className =
                "worker-details";

            details.textContent =
                (
                    worker.EmpID || ""
                ) +
                " | " +
                (
                    worker.Designation || ""
                ) +
                " | " +
                (
                    worker.Company || ""
                );

            info.appendChild(name);
            info.appendChild(details);


            const removeBtn =
                document.createElement("button");

            removeBtn.type =
                "button";

            removeBtn.className =
                "remove-worker";

            removeBtn.textContent =
                "Remove";

            removeBtn.addEventListener(
                "click",
                function () {

                    selectedWorkers.splice(
                        index,
                        1
                    );

                    renderSelectedWorkers();

                }
            );


            card.appendChild(info);
            card.appendChild(removeBtn);

            selectedWorkersContainer
                .appendChild(card);

        }
    );

}


/*
==========================================================
STATUS
==========================================================
*/

function showStatus(
    message,
    type
) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message";

    if (type === "success") {

        statusMessage
            .classList
            .add("success-message");

    } else if (type === "error") {

        statusMessage
            .classList
            .add("error-message");

    } else {

        statusMessage
            .classList
            .add("info-message");

    }

}


/*==========================================================
SUBMIT TO POWER AUTOMATE
==========================================================*/

const flowUrl =
    "https://0eb71ffa4b02edec861c63608d58f3.42.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/0567c146a09f4c0eb2e170c73e539d0d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hTOEvG9YzWgY1U63SGf7xruK7jXD9JO1ZnjmfBcDt34";


submitBtn.addEventListener(
    "click",
    async function () {

        console.log(
            "Submit button clicked"
        );


        /*==================================================
        VALIDATION
        ==================================================*/

        if (!selectedPO) {

            showStatus(
                "Please select a PO first.",
                "error"
            );

            return;

        }


        if (selectedWorkers.length === 0) {

            showStatus(
                "Please select at least one worker.",
                "error"
            );

            return;

        }


        /*==================================================
        GET JOB TYPE
        ==================================================*/

        const selectedJobType =
            document.querySelector(
                'input[name="jobType"]:checked'
            );


        const typeOfJob =
            selectedJobType
                ? selectedJobType.value
                : "N";


        /*==================================================
        BUILD WORKERS
        ==================================================*/

        const workers =
            selectedWorkers.map(
                function (worker) {

                    return {

                        EmpID:
                            worker.EmpID || "",

                        FirstName:
                            worker.FirstName || "",

                        LastName:
                            worker.LastName || "",

                        Designation:
                            worker.Designation || "",

                        Company:
                            worker.Company || ""

                    };

                }
            );


        /*==================================================
        BUILD SUBMISSION JSON
        ==================================================*/

        const submissionData = {

            PO_ID:
                selectedPO.PO_ID || "",

            WorkOrder:
                Number(selectedPO.WorkOrder) || 0,

            Description:
                selectedPO.Description || "",

            TypeofJob:
                typeOfJob,

            ReplacementID:
                selectedReplacement
                    ? selectedReplacement.ReplacementID
                    : null,

            Workers:
                workers

        };


        console.log(
            "Submission Data:",
            submissionData
        );


        /*==================================================
        SUBMIT
        ==================================================*/

        submitBtn.disabled = true;

        showStatus(
            "Submitting...",
            "info"
        );


        try {

            const response =
                await fetch(
                    flowUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                submissionData
                            )
                    }
                );


            const responseText =
                await response.text();


            console.log(
                "HTTP Status:",
                response.status
            );

            console.log(
                "Response:",
                responseText
            );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status +
                    ": " +
                    responseText
                );

            }


            showStatus(
                "Submission successful.",
                "success"
            );


            alert(
                "Submission successful!"
            );


            /*================================================
            CLEAR FORM AFTER SUCCESS
            =================================================*/

            selectedPO = null;

            selectedReplacement = null;

            selectedWorkers = [];

            poSearch.value = "";

            poDetails.classList.add(
                "hidden"
            );

            replacementSelect.value = "";

            renderSelectedWorkers();


        } catch (error) {

            console.error(
                "Submission error:",
                error
            );


            showStatus(
                "Submission failed. Please try again.",
                "error"
            );


            alert(
                "Submission failed:\n\n" +
                error.message
            );


        } finally {

            submitBtn.disabled = false;

        }

    }
);

/*
==========================================================
CLOSE DROPDOWNS WHEN CLICKING OUTSIDE
==========================================================
*/

document.addEventListener(
    "click",
    function (event) {

        if (
            !poSearch.contains(event.target) &&
            !poDropdown.contains(event.target)
        ) {

            poDropdown
                .classList
                .add("hidden");

        }

        if (
            !workerSearch.contains(event.target) &&
            !workerDropdown.contains(event.target)
        ) {

            workerDropdown
                .classList
                .add("hidden");

        }

    }
);

</script>
